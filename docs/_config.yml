title: Clean Architecture with .NET, Angular and Docker
description: A production-ready full-stack starter - Angular 22, .NET 10 and PostgreSQL 17 built on Clean Architecture, orchestrated with .NET Aspire and Docker.
remote_theme: just-the-docs/just-the-docs

lang: en-US

plugins:
  - jekyll-seo-tag
  # Keeps the old capitalised /Frontend URL working after the lowercase fix.
  - jekyll-redirect-from

# `url` is the origin ONLY. The project path lives in `baseurl`.
# Putting the path in `url` doubles it into every canonical/og:url that
# jekyll-seo-tag emits, which canonicalised every page here to a 404 on a
# domain (github.io) that is not even the one being submitted to Search Console.
url: https://nitinksingh.com
baseurl: /clean-architecture-docker-dotnet-angular

# Social / structured-data identity used by jekyll-seo-tag.
author:
  name: Nitin Singh
twitter:
  username: nitin27may
  card: summary_large_image

# Give every page an og:image unless it overrides `image` itself.
defaults:
  - scope:
      path: ""
    values:
      image: /screenshots/landing-page.png

# Enable search
search_enabled: true

# Enable support for hyphenated search keywords
search_tokenizer_separator: /[\s/]+/

# Aux links for the upper right navigation
aux_links:
  "View on GitHub":
    - "//github.com/nitin27may/clean-architecture-docker-dotnet-angular"
  # This site had no link out of it anywhere -- not to the blog it is published
  # under, not to its sibling doc sites. That is the real reason Search Console
  # reported it as never crawled: nothing on the web pointed here.
  "nitinksingh.com":
    - "/"

# Footer content
# Site-wide footer. Identical on all four doc sites by design, so the family
# reads as one property rather than four unrelated microsites -- keep it
# byte-identical when editing.
#
# It lives in the footer rather than only in aux_links because the footer
# renders on EVERY page, while aux_links reads as chrome and is easy to miss.
# Raw HTML is safe: the theme interpolates this without escaping (verified
# against live output -- `&copy;` arrives as an entity, not `&amp;copy;`).
#
# Sibling doc-site links are deliberately NOT here; they live in
# nav_external_links below, which is per-site and can differ freely.
footer_content: '&copy; 2026 <a href="https://nitinksingh.com/">Nitin Singh</a> &middot; MIT License'

# Color scheme supports "light" (default) and "dark"
color_scheme: light

# Add spacing to fix title cropping issue
heading_anchors: true

# Fixed spacing configuration
callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    color: blue
  new:
    color: green
  note:
    color: purple
  warning:
    color: red

# Set the proper spacing
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
  
# Add custom CSS for spacing
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/nitin27may/clean-architecture-docker-dotnet-angular"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Enable navigation structure
nav_external_links:
  - title: Clean Architecture on GitHub
    url: https://github.com/nitin27may/clean-architecture-docker-dotnet-angular
    hide_icon: false
  # The sibling doc sites, all published under the same domain. Trailing slashes
  # are required: GitHub Pages 301s the unslashed form of a directory index.
  - title: AI Knowledge Hub
    url: https://nitinksingh.com/ai-resources/
    hide_icon: false
  - title: E-Commerce Agents
    url: https://nitinksingh.com/e-commerce-agents/
    hide_icon: false
  - title: MEAN Stack with Docker
    url: https://nitinksingh.com/mean-docker/
    hide_icon: false

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Enable copy code button
enable_copy_code_button: true

# Google Analytics tracking
ga_tracking: G-5Z8HS51RCP
ga_tracking_anonymize_ip: true

