version: 2
updates:
  # .NET — the solution and Directory.Packages.props (Central Package Management) live at the
  # repo root, so one entry covers backend/ and aspire/.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Aspire packages must move together, majors included.
      aspire:
        patterns:
          - "Aspire.*"
    open-pull-requests-limit: 10

  # Frontend — Angular
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      angular-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Angular pins the TypeScript range it supports; take TypeScript upgrades with Angular.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Tracks the Node.js runtime in .nvmrc / frontend/Dockerfile, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # Docker base images (Dockerfile.api, frontend/Dockerfile, loadbalancer/Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/frontend"
      - "/loadbalancer"
    schedule:
      interval: "weekly"
    groups:
      # sdk and aspnet images have to change together with the TargetFramework.
      dotnet-images:
        patterns:
          - "dotnet/*"
    open-pull-requests-limit: 5

  # Images referenced from the compose files (postgres, pgadmin)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows in this repo
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
