version: 2
updates:
  # Backend — Contact.Api, Contact.Application, Contact.Infrastructure, Contact.Domain, Contact.Common
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # .NET Aspire host + service defaults — kept separate so a major Aspire bump doesn't
  # get grouped in with routine backend patch updates.
  - package-ecosystem: "nuget"
    directory: "/aspire"
    schedule:
      interval: "weekly"
    groups:
      aspire-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Frontend — Angular
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      angular-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows in this repo
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
